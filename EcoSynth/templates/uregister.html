{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - EcoSynth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-xl w-full bg-white p-8 rounded-lg shadow-md">
      <h2 class="text-3xl font-bold text-center text-green-700 mb-6">Register</h2>
      <form action="{% url 'uregister' %}" method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
        {% csrf_token %}

        <!-- Name -->
        <div class="mb-4">
          <label class="block text-gray-700 font-semibold mb-2">Name</label>
          <input type="text" name="name" id="name" class="w-full border px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
          <p id="nameError" class="text-red-600 text-sm mt-1 hidden">Name is required.</p>
        </div>

        <!-- Age -->
        <div class="mb-4">
          <label class="block text-gray-700 font-semibold mb-2">Age</label>
          <input type="number" name="age" id="age" class="w-full border px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
          <p id="ageError" class="text-red-600 text-sm mt-1 hidden">You must be at least 18 years old.</p>
        </div>

        <!-- Email -->
        <div class="mb-4">
          <label class="block text-gray-700 font-semibold mb-2">Email</label>
          <input type="email" name="email" id="email" class="w-full border px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
          <p id="emailError" class="text-red-600 text-sm mt-1 hidden">Enter a valid email address.</p>
        </div>

        <!-- Phone -->
        <div class="mb-4">
          <label class="block text-gray-700 font-semibold mb-2">Phone Number</label>
          <input type="text" name="phone" id="phone" class="w-full border px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
          <p id="phoneError" class="text-red-600 text-sm mt-1 hidden">Phone number must be 10 digits.</p>
        </div>

        <!-- Address -->
        <div class="mb-4">
          <label class="block text-gray-700 font-semibold mb-2">Address</label>
          <textarea name="address" id="address" class="w-full border px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"></textarea>
          <p id="addressError" class="text-red-600 text-sm mt-1 hidden">Address is required.</p>
        </div>

        <!-- Profile Picture -->
        <div class="mb-6">
          <label class="block text-gray-700 font-semibold mb-2">Profile Picture</label>
          <input type="file" name="profile_pic" id="profile_pic" accept="image/*" class="w-full">
          <p id="picError" class="text-red-600 text-sm mt-1 hidden">Profile picture is required.</p>
        </div>

        <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-500 transition">Submit</button>
      </form>
    </div>
  </div>

  <!-- JavaScript Validation -->
  <script>
    function validateForm() {
      const name = document.getElementById("name").value.trim();
      const age = document.getElementById("age").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();
      const profilePic = document.getElementById("profile_pic").value;

      const nameError = document.getElementById("nameError");
      const ageError = document.getElementById("ageError");
      const emailError = document.getElementById("emailError");
      const phoneError = document.getElementById("phoneError");
      const addressError = document.getElementById("addressError");
      const picError = document.getElementById("picError");

      nameError.classList.add("hidden");
      ageError.classList.add("hidden");
      emailError.classList.add("hidden");
      phoneError.classList.add("hidden");
      addressError.classList.add("hidden");
      picError.classList.add("hidden");

      let isValid = true;

      if (name === "") {
        nameError.classList.remove("hidden");
        isValid = false;
      }

      if (age === "" || isNaN(age) || parseInt(age) < 18) {
        ageError.classList.remove("hidden");
        isValid = false;
      }

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        emailError.classList.remove("hidden");
        isValid = false;
      }

      if (!/^\d{10}$/.test(phone)) {
        phoneError.classList.remove("hidden");
        isValid = false;
      }

      if (address === "") {
        addressError.classList.remove("hidden");
        isValid = false;
      }

      if (profilePic === "") {
        picError.classList.remove("hidden");
        isValid = false;
      }

      return isValid;
    }
  </script>
</body>
</html>
