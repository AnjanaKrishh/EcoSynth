<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .contact-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2em;
        }
        .contact-item i {
            font-size: 1.5em;
            color: #28a745; /* Green icons */
        }
        .contact-item a {
            color: #333;
            text-decoration: none;
            transition: color 0.3s;
        }
        .contact-item a:hover {
            color: #3498db;
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            background-color: #28a745; /* Green footer */
            color: #fff;
            text-align: center;
        }
        footer a {
            color: #3498db;
            text-decoration: none;
            margin: 0 10px;
        }
        footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 15px;
            }
            h1 {
                font-size: 2em;
            }
            .contact-item {
                font-size: 1em;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <p>Feel free to reach out to us with any questions or inquiries.</p>
        <div class="contact-info">
            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <a href="mailto:support@example.com">info@ecosynth.com</a>
            </div>
            <div class="contact-item">
                <i class="fas fa-phone"></i>
                <a href="tel:+1234567890">91966728282</a>
            </div>
        </div>
    </div>
    <footer>
        <p>© 2025 Your Company Name. All rights reserved.</p>
        <p>
            <a href="/terms">Terms and Conditions</a> |
            <a href="/privacy">Privacy Policy</a>
        </p>
    </footer>
</body>
</html>
