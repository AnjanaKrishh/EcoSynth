{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - EcoSynth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md">
      <h2 class="text-3xl font-bold text-center text-green-700 mb-6">Login</h2>

      {% if error %}
      <p class="text-red-600 text-sm mb-4 text-center">{{ error }}</p>
      {% endif %}

      <form method="POST" action="{% url 'ulogin' %}" onsubmit="return validateLogin()">
        {% csrf_token %}

        <!-- Email -->
        <div class="mb-4">
          <label class="block text-gray-700 font-semibold mb-2">Email</label>
          <input type="email" name="email" id="email" class="w-full border px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
          <p id="emailError" class="text-red-600 text-sm mt-1 hidden">Valid email is required.</p>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label class="block text-gray-700 font-semibold mb-2">Password</label>
          <input type="password" name="password" id="password" class="w-full border px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
          <p id="passwordError" class="text-red-600 text-sm mt-1 hidden">Password is required.</p>
        </div>

        <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-500 transition">Login</button>
      </form>
    </div>
  </div>

  <script>
    function validateLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      let valid = true;

      document.getElementById("emailError").classList.add("hidden");
      document.getElementById("passwordError").classList.add("hidden");

      if (!email.match(/^[^@\s]+@[^@\s]+\.[^@\s]+$/)) {
        document.getElementById("emailError").classList.remove("hidden");
        valid = false;
      }

      if (password === "") {
        document.getElementById("passwordError").classList.remove("hidden");
        valid = false;
      }

      return valid;
    }
  </script>
</body>
</html>
