<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosynth Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out;
        }
        .animate-scale-hover {
            transition: transform 0.3s ease;
        }
        .animate-scale-hover:hover {
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .bg-gradient-eco {
            background: linear-gradient(135deg, #66BB6A 0%, #2E7D32 100%);
        }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">
    <div class="container mx-auto px-4">
        <div class="max-w-sm mx-auto bg-white rounded-xl shadow-xl overflow-hidden animate-fade-in">
            <div class="bg-gradient-eco p-8 text-center">
                <h1 class="text-3xl font-bold text-white flex items-center justify-center gap-3">
                    <i class="fas fa-leaf"></i> Ecosynth Admin
                </h1>
                <p class="text-green-100 mt-3 text-sm">Waste Management Dashboard</p>
            </div>
            <div class="p-8">
                <form method="POST" action="{% url 'adminlogin' %}">
                    {% csrf_token %}
                    <div class="mb-5">
                        <label for="username" class="block text-gray-700 font-semibold mb-2 flex items-center gap-2">
                            <i class="fas fa-user text-green-600"></i> Username
                        </label>
                        <input type="text" id="username" name="username" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-300" placeholder="Enter username" required>
                    </div>
                    <div class="mb-6">
                        <label for="password" class="block text-gray-700 font-semibold mb-2 flex items-center gap-2">
                            <i class="fas fa-lock text-green-600"></i> Password
                        </label>
                        <input type="password" id="password" name="password" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-300" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white p-3 rounded-lg hover:bg-green-700 transition duration-300 flex items-center justify-center gap-2 animate-scale-hover">
                        <i class="fas fa-sign-in-alt">
                            <a href="/adminhome/" class="nav-link">Sign In</a>
                        </i> 
                    </button>
                </form>
                <p class="text-center text-gray-600 mt-5 text-sm">
                    Forgot password? <a href="#" class="text-green-600 hover:underline">Reset here</a>
                </p>
            </div>
            <div class="bg-gray-100 p-4 text-center">
                <p class="text-gray-500 text-xs">© 2025 Ecosynth. All rights reserved.</p>
            </div>
        </div>
    </div>
</body>
</html>
