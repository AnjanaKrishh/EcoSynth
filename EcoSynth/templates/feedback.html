{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback - EcoSynth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    .star {
      font-size: 1.8rem;
      cursor: pointer;
      color: #d1d5db; /* gray-300 */
    }
    .star.selected {
      color: #fbbf24; /* yellow-400 */
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <div class="bg-green-700 text-white py-4 px-6 flex justify-between items-center shadow">
    <div class="text-2xl font-bold">Feedback</div>
    <a href="{% url 'udashboard' %}" class="bg-white text-green-700 px-4 py-2 rounded hover:bg-gray-100">Back to Dashboard</a>
  </div>

  <!-- Feedback Form -->
  <div class="flex-grow flex items-center justify-center px-4">
    <div class="max-w-xl w-full bg-white p-8 rounded-lg shadow-md mt-8">
      <h2 class="text-2xl font-bold text-green-700 mb-4 text-center">We value your feedback</h2>
      
      {% if success %}
        <p class="text-green-600 text-center mb-4 font-medium">{{ success }}</p>
      {% elif error %}
        <p class="text-red-600 text-center mb-4 font-medium">{{ error }}</p>
      {% endif %}

      <form method="POST" action="{% url 'feedback' %}">
        {% csrf_token %}

        <!-- Star Rating -->
        <div class="flex justify-center mb-4">
          <input type="hidden" name="rating" id="rating" value="0">
          <span class="star" onclick="setRating(1)">&#9733;</span>
          <span class="star" onclick="setRating(2)">&#9733;</span>
          <span class="star" onclick="setRating(3)">&#9733;</span>
          <span class="star" onclick="setRating(4)">&#9733;</span>
          <span class="star" onclick="setRating(5)">&#9733;</span>
        </div>

        <textarea name="message" rows="5" placeholder="Enter your feedback here..." class="w-full border px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400 resize-none"></textarea>
        <button type="submit" class="mt-4 w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-500 transition">Submit Feedback</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div class="text-center py-4 text-sm text-gray-600">
    &copy; 2025 EcoSynth. All rights reserved.
  </div>

  <script>
    function setRating(star) {
      document.getElementById('rating').value = star;
      const stars = document.querySelectorAll('.star');
      stars.forEach((s, index) => {
        s.classList.toggle('selected', index < star);
      });
    }
  </script>

</body>
</html>
