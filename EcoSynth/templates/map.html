<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Current Location Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    #loading {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <div id="loading">Fetching location...</div>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    function initMap(lat, lon) {
      const map = L.map('map').setView([lat, lon], 15); // Zoom level 15 for street-level

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      L.marker([lat, lon])
        .addTo(map)
        .bindPopup("You are here.")
        .openPopup();

      document.getElementById("loading").style.display = "none";
    }

    function showError(error) {
      const loading = document.getElementById("loading");
      switch(error.code) {
        case error.PERMISSION_DENIED:
          loading.innerText = "User denied the request for Geolocation.";
          break;
        case error.POSITION_UNAVAILABLE:
          loading.innerText = "Location information is unavailable.";
          break;
        case error.TIMEOUT:
          loading.innerText = "The request to get user location timed out.";
          break;
        default:
          loading.innerText = "An unknown error occurred.";
          break;
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          initMap(lat, lon);
        },
        showError
      );
    } else {
      document.getElementById("loading").innerText = "Geolocation is not supported by this browser.";
    }
  </script>
</body>
</html>
