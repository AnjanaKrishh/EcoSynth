{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - EcoSynth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    .error-message {
      transition: opacity 0.3s ease-in-out;
    }
    .error-visible {
      opacity: 1;
    }
    .error-hidden {
      opacity: 0;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-white p-10 rounded-xl shadow-lg">
      <div class="flex justify-center mb-6">
        <img src="{% static 'images/logo.png' %}" alt="EcoSynth Logo" class="h-16 w-auto">
      </div>
      <h2 class="text-3xl font-bold text-center text-green-700 mb-8">Reset Your Password</h2>
      <p class="text-center text-gray-600 mb-6">Enter your email address to receive a password reset link.</p>

      {% if messages %}
        {% for message in messages %}
        <p class="text-red-600 text-sm mb-4 text-center bg-red-50 p-2 rounded-lg">{{ message }}</p>
        {% endfor %}
      {% endif %}

      <form method="POST" action="{% url 'forgot_password' %}" onsubmit="return validateForgotPassword()">
        {% csrf_token %}

        <!-- Email -->
        <div class="mb-6">
          <label for="email" class="block text-gray-700 font-semibold mb-2">Email Address</label>
          <input type="email" name="email" id="email" class="w-full border px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition" aria-required="true" aria-describedby="emailError" required>
          <p id="emailError" class="text-red-600 text-sm mt-1 error-message error-hidden">Enter a valid email address.</p>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitButton" class="w-full bg-gradient-to-r from-green-600 to-green-700 text-white py-3 px-4 rounded-lg hover:from-green-700 hover:to-green-800 transition flex items-center justify-center">
          <span id="buttonText">Send Reset Link</span>
          <svg id="loadingSpinner" class="animate-spin h-5 w-5 ml-2 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>

        <!-- Back to Login Link -->
        <p class="text-center text-gray-600 mt-6">Remember your password? <a href="{% url 'ulogin' %}" class="text-green-600 hover:underline">Log In</a></p>
      </form>
    </div>
  </div>

  <!-- JavaScript Validation -->
  <script>
    function validateForgotPassword() {
      const email = document.getElementById("email").value.trim();
      const submitButton = document.getElementById("submitButton");
      const buttonText = document.getElementById("buttonText");
      const loadingSpinner = document.getElementById("loadingSpinner");
      const emailError = document.getElementById("emailError");

      // Reset error message
      emailError.classList.add("error-hidden");

      let isValid = true;

      // Email validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        emailError.classList.remove("error-hidden");
        isValid = false;
      }

      // Show loading state
      if (isValid) {
        submitButton.disabled = true;
        buttonText.textContent = "Sending...";
        loadingSpinner.classList.remove("hidden");
      }

      return isValid;
    }
  </script>
</body>
</html>
