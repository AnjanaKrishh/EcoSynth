<!DOCTYPE html>
<html>
<head>
    <title>Add Repairman</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10 max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-center text-blue-700 mb-8">Add Repairman</h1>

    <form method="POST" enctype="multipart/form-data" class="space-y-5 bg-white p-8 rounded-xl shadow-lg">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Name" class="w-full p-3 border rounded-lg" required>
        <input type="number" name="age" placeholder="Age" class="w-full p-3 border rounded-lg" required>
        <input type="email" name="email" placeholder="Email" class="w-full p-3 border rounded-lg" required>
        <input type="text" name="phone" placeholder="Phone Number" class="w-full p-3 border rounded-lg" required>
        <textarea name="address" placeholder="Address" class="w-full p-3 border rounded-lg" required></textarea>
        <input type="password" name="password" placeholder="Password" class="w-full p-3 border rounded-lg" required>
        <input type="file" name="image" class="w-full p-3 border rounded-lg" required>

        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">Save</button>
    </form>

    <div class="text-center mt-6">
        <a href="{% url 'add_repairman' %}" class="text-blue-600 hover:underline">← Back</a>
    </div>
</body>
</html>
