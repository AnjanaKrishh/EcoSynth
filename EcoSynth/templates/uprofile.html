{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile - EcoSynth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <div class="bg-green-700 text-white py-4 px-6 flex justify-between items-center shadow">
    <h1 class="text-xl font-bold">User Profile</h1>
    <a href="{% url 'udashboard' %}" class="bg-white text-green-700 px-4 py-1.5 rounded hover:bg-gray-100 text-sm font-medium">← Back to Dashboard</a>
  </div>

  <!-- Profile Container -->
  <div class="flex justify-center items-center flex-grow px-4 py-10">
    <div class="bg-white rounded-xl shadow-lg p-8 max-w-xl w-full">
      <div class="flex flex-col items-center text-center">
        <img src="{{ user.profile_pic.url }}" class="w-28 h-28 rounded-full border-4 border-green-600 shadow mb-4 object-cover" alt="Profile Picture">
        <h2 class="text-2xl font-semibold text-gray-800">{{ user.name }}</h2>
        <p class="text-sm text-gray-500 mb-2">{{ user.email }}</p>
        <a href="{% url 'ueditprofile' %}" class="mt-2 text-green-600 hover:underline text-sm font-medium">✏️ Edit Profile</a>
      </div>

      <div class="mt-6 space-y-4 text-gray-700 text-sm">
        <div class="flex justify-between">
          <span class="font-medium text-gray-600">Phone:</span>
          <span>{{ user.phone }}</span>
        </div>
        <div class="flex justify-between">
          <span class="font-medium text-gray-600">Address:</span>
          <span class="text-right">{{ user.address }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-400 pb-4">
    &copy; 2025 EcoSynth. All rights reserved.
  </footer>

</body>
</html>
