<!DOCTYPE html>
<html>
<head>
    <title>Buy Eco-Friendly Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="max-w-6xl mx-auto px-6 py-10">
    
    <!-- Header with Title and View Cart button -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-green-700">Eco-Friendly Products</h1>
      <a href="{% url 'view_cart' %}" class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded shadow">
        🛒 View Cart
      </a>
    </div>

    <!-- Products Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for item in products %}
      <div class="bg-white shadow rounded-xl p-5">
        <img src="{{ item.image.url }}" alt="{{ item.name }}" class="h-40 w-full object-cover rounded">
        <h2 class="text-xl font-semibold text-green-800 mt-4">{{ item.name }}</h2>
        <p class="text-gray-600 mt-1">{{ item.description }}</p>
        <p class="text-green-700 font-bold mt-2">₹ {{ item.price }}</p>
        <p class="text-sm text-gray-500">Quantity: {{ item.quantity }}</p>
        <br>
        <a href="{% url 'add_to_cart' item.id %}" 
           class="bg-green-600 hover:bg-green-700 text-white font-semibold px-4 py-2 rounded shadow block text-center mt-4">
          + Add To Cart
        </a>
      </div>
      {% empty %}
      <p class="text-gray-600 col-span-full">No eco products available yet.</p>
      {% endfor %}
    </div>
  </div>
</body>
</html>
