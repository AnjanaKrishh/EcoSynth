{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile - EcoSynth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">

  <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold text-green-700 mb-6 text-center">Edit Profile</h2>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- Profile Picture Preview -->
      <div class="flex flex-col items-center mb-6">
        <img src="{{ user.profile_pic.url }}" alt="Profile Image" class="w-28 h-28 rounded-full border-2 border-green-500 object-cover">
        <label class="block mt-4 text-sm font-medium text-gray-700">Change Profile Picture:</label>
        <input type="file" name="profile_pic" class="mt-1 text-sm" accept="image/*">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700">Name</label>
          <input type="text" name="name" value="{{ user.name }}" class="mt-1 w-full border px-4 py-2 rounded-lg focus:ring-green-500 focus:border-green-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" name="email" value="{{ user.email }}" class="mt-1 w-full border px-4 py-2 rounded-lg focus:ring-green-500 focus:border-green-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Phone</label>
          <input type="text" name="phone" value="{{ user.phone }}" class="mt-1 w-full border px-4 py-2 rounded-lg focus:ring-green-500 focus:border-green-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Address</label>
          <input type="text" name="address" value="{{ user.address }}" class="mt-1 w-full border px-4 py-2 rounded-lg focus:ring-green-500 focus:border-green-500">
        </div>
      </div>

      <div class="mt-6 text-center">
        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition">Save Changes</button>
        <a href="{% url 'udashboard' %}" class="ml-4 text-gray-600 hover:text-green-700 underline">Cancel</a>
      </div>
    </form>
  </div>

</body>
</html>
