{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Pickupman</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">

    <div class="bg-white rounded-xl shadow-xl p-10 w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-green-700 mb-8">Add Pickupman</h1>

        <!-- ✅ Display messages -->
        {% if messages %}
            <ul class="mb-6">
                {% for message in messages %}
                    <li class="text-center text-sm {% if message.tags == 'error' %}text-red-600{% else %}text-green-600{% endif %}">
                        {{ message }}
                    </li>
                {% endfor %}
            </ul>
        {% endif %}

        <!-- ✅ Form starts -->
        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}

            <input type="text" name="name" placeholder="Name" class="w-full p-3 border border-gray-300 rounded-lg" required>

            <input type="number" name="age" placeholder="Age" class="w-full p-3 border border-gray-300 rounded-lg" required>

            <input type="email" name="email" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-lg" required>

            <input type="text" name="phone" placeholder="Phone Number" class="w-full p-3 border border-gray-300 rounded-lg" required>

            <textarea name="address" placeholder="Address" class="w-full p-3 border border-gray-300 rounded-lg" required></textarea>

            <input type="password" name="password" placeholder="Password" class="w-full p-3 border border-gray-300 rounded-lg" required>

            <input type="file" name="image" class="w-full p-3 border border-gray-300 rounded-lg" required>

            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition">
                Save Pickupman
            </button>
        </form>

        <!-- ✅ Back link -->
        <div class="text-center mt-6">
            <a href="{% url 'add_workers_option' %}" class="text-green-600 hover:underline">
                ← Back
            </a>
        </div>
    </div>

</body>
</html>
